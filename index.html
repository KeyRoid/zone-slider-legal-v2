<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Zone Slider Legal</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #071526;
      --panel: #ffffff;
      --text: #102033;
      --muted: #5d6b7a;
      --accent: #10bde8;
      --line: #d9e4ec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #071526, #0c2a43 55%, #0b4654);
      color: var(--text);
      line-height: 1.65;
    }
    main {
      width: min(880px, calc(100% - 32px));
      margin: 48px auto;
      padding: 32px;
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
    }
    h1 { margin: 0 0 8px; font-size: 2rem; line-height: 1.2; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    nav {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }
    a {
      color: #075f7a;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }
    nav a {
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f7fbfd;
      font-weight: 700;
      text-decoration: none;
    }
    footer {
      margin-top: 32px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Zone Slider Legal</h1>
    <p class="muted">Legal and support documents for Zone Slider.</p>
    <p>Zone Slider is provided by KENTA OSAWA. Google Play developer name: Keyroid.</p>
    <nav aria-label="Legal documents">
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Use</a>
      <a href="support.html">Support</a>
      <a href="licenses.html">Open Source Licenses</a>
      <a href="tokushoho.html">Specified Commercial Transactions Act Disclosure</a>
    </nav>
    <footer>
      Contact: <a href="mailto:keyroid.ai@gmail.com">keyroid.ai@gmail.com</a>
    </footer>
  </main>
</body>
</html>
