<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #071526;
      --surface: #ffffff;
      --text: #102033;
      --muted: #5d6b7a;
      --line: #d9e4ec;
      --link: #075f7a;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.7;
    }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 48px auto;
      padding: 32px;
      background: var(--surface);
      border-radius: 16px;
    }
    h1,
    h2 {
      line-height: 1.25;
    }
    h1 {
      margin-top: 0;
    }
    h2 {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }
    p {
      margin: 0 0 14px;
    }
    a {
      color: var(--link);
      word-break: break-word;
    }
    .muted {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <h1>Support</h1>
    <p>For questions, bug reports, or feedback about this app, please contact us by email.</p>
    <p>Email: <a href="mailto:keyroid.ai@gmail.com">keyroid.ai@gmail.com</a></p>

    <h2>サポート</h2>
    <p>アプリに関する不具合報告・ご質問・ご要望は、以下のメールアドレスまでご連絡ください。</p>
    <p>Email: <a href="mailto:keyroid.ai@gmail.com">keyroid.ai@gmail.com</a></p>

    <p class="muted">Zone Slider / Keyroid</p>
  </main>
</body>
</html>
